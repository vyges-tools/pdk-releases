name: Build PDK releases
run-name: "build ${{ github.event.inputs.family || 'all (weekly)' }} — ciel from mirror"

# Builds the ciel-buildable PDK families from their Vyges mirrors using `ciel` as the
# commodity builder, and publishes per-library tarball releases here. ONE job builds the
# selected families in a SHARED Nix shell (ciel + magic + klayout + ghr) — a single Nix
# install + closure for all of them — and the Nix store is cached across runs, so the
# heavy EDA closure isn't re-downloaded each week. scripts/ci_build.sh resolves each
# family's source commit, skips it if that commit is already released (idempotent; last
# release stays) unless `force`, and builds only what changed. sky130/gf180 build from the
# open_pdks mirror; ihp-sg13g2 from ihp-open-pdk (OPDKS_REPO_* / IHP_REPO_*).

on:
  workflow_dispatch:
    inputs:
      family:
        description: 'sky130 | gf180mcu | ihp-sg13g2 | all'
        default: all
      force:
        description: 'rebuild even if the source commit is already released'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC

permissions:
  contents: write          # ghr creates releases on this repo

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600    # all families serial worst-case; skip-unchanged keeps it short
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache the Nix store (ciel + magic + klayout closure, reused across runs)
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-eda-${{ runner.os }}-${{ hashFiles('.github/workflows/build-release.yml') }}
          restore-prefixes-first-match: nix-eda-${{ runner.os }}-

      - name: Build the selected families in one shared Nix env
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAMILY: ${{ github.event.inputs.family }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          chmod +x scripts/ci_build.sh
          nix shell \
            'github:fossi-foundation/ciel' \
            'github:fossi-foundation/nix-eda#magic' \
            'github:fossi-foundation/nix-eda#klayout' \
            'nixpkgs#ghr' \
            --accept-flake-config \
            --command bash scripts/ci_build.sh
