name: Build PDK releases
run-name: "build ${{ github.event.inputs.family || 'all (weekly)' }} — ciel from mirror"

# Builds the ciel-buildable PDK families from their Vyges mirrors using `ciel` as the
# commodity builder, and publishes per-library tarball releases here. ONE job installs Nix
# once and caches the magic/klayout/ciel closure across runs; each family is its own
# STAGE (step) for clear per-PDK status/timing. scripts/ci_build.sh resolves a family's
# source commit and skips it (no Nix work) if that commit is already released ("promote
# last release") unless `force`. sky130/gf180 build from the open_pdks mirror; ihp-sg13g2
# from ihp-open-pdk (OPDKS_REPO_* / IHP_REPO_*). icsprout55 is a separate workflow
# (package-release.yml — the generic-packager path).

on:
  workflow_dispatch:
    inputs:
      family:
        description: 'sky130 | gf180mcu | ihp-sg13g2 | all'
        default: all
      force:
        description: 'rebuild even if the source commit is already released'
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC

permissions:
  contents: write          # ghr creates releases on this repo

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600    # families build serially; skip-unchanged keeps it short
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE: ${{ github.event.inputs.force }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache the Nix store (ciel + magic + klayout closure, reused across runs)
        uses: nix-community/cache-nix-action@v6
        continue-on-error: true   # caching is an optimization — never let it block a build
        with:
          primary-key: nix-eda-${{ runner.os }}-${{ hashFiles('.github/workflows/build-release.yml') }}
          restore-prefixes-first-match: nix-eda-${{ runner.os }}-

      # One stage per PDK — clear per-family status/timing in the Actions UI. A stage skips
      # itself (no Nix work) when its source commit is already released.
      - name: sky130
        if: ${{ github.event.inputs.family == '' || github.event.inputs.family == 'all' || github.event.inputs.family == 'sky130' }}
        run: bash scripts/ci_build.sh sky130

      - name: gf180mcu
        if: ${{ github.event.inputs.family == '' || github.event.inputs.family == 'all' || github.event.inputs.family == 'gf180mcu' }}
        run: bash scripts/ci_build.sh gf180mcu

      - name: ihp-sg13g2
        if: ${{ github.event.inputs.family == '' || github.event.inputs.family == 'all' || github.event.inputs.family == 'ihp-sg13g2' }}
        run: bash scripts/ci_build.sh ihp-sg13g2
