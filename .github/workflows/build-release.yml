name: Build PDK releases

# Builds the ciel-buildable PDK families from their Vyges mirrors using `ciel` as the
# commodity builder, and publishes per-library tarball releases here — modeling
# fossi-foundation/ciel-releases. sky130/gf180 build from the open_pdks mirror;
# ihp-sg13g2 builds from the ihp-open-pdk mirror (ciel reads OPDKS_REPO_* / IHP_REPO_*).
# A full sky130 build is heavy (~1-2h, magic toolchain via Nix); gf180/ihp are lighter.

on:
  workflow_dispatch:
    inputs:
      family:
        description: 'sky130 | gf180mcu | ihp-sg13g2 | all'
        default: all
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC

permissions:
  contents: write          # ghr creates releases on this repo

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: sky130
            mirror: open_pdks
            branch: master
            src: OPDKS
          - family: gf180mcu
            mirror: open_pdks
            branch: master
            src: OPDKS
          - family: ihp-sg13g2
            mirror: ihp-open-pdk
            branch: main
            src: IHP
    steps:
      - uses: actions/checkout@v4

      - name: Gate on the requested family (manual dispatch)
        id: gate
        run: |
          REQ='${{ github.event.inputs.family }}'
          if [ -z "$REQ" ] || [ "$REQ" = all ] || [ "$REQ" = '${{ matrix.family }}' ]; then
            echo 'run=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'run=no' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nix
        if: steps.gate.outputs.run == 'yes'
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build from the Vyges mirror + publish the release
        if: steps.gate.outputs.run == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          MIRROR='${{ matrix.mirror }}'
          # ciel reads OPDKS_REPO_* (sky130/gf180) or IHP_REPO_* (ihp) to pick the source —
          # point whichever applies at the Vyges mirror.
          if [ '${{ matrix.src }}' = OPDKS ]; then
            export OPDKS_REPO_OWNER=vyges-tools OPDKS_REPO_NAME="${MIRROR}"
          else
            export IHP_REPO_OWNER=vyges-tools IHP_REPO_NAME="${MIRROR}"
          fi
          VERSION=$(git ls-remote "https://github.com/vyges-tools/${MIRROR}.git" '${{ matrix.branch }}' | awk 'NR==1{print $1}')
          echo "Building ${{ matrix.family }} @ ${MIRROR} ${VERSION}"
          PDK_ROOT="${PWD}/pdk-root"; mkdir -p "${PDK_ROOT}"
          nix shell \
            'github:fossi-foundation/ciel' \
            'github:fossi-foundation/nix-eda#magic' \
            'github:fossi-foundation/nix-eda#klayout' \
            'nixpkgs#ghr' \
            --accept-flake-config \
            --command bash -euxo pipefail -c "
              ciel build --pdk-family ${{ matrix.family }} --pdk-root '${PDK_ROOT}' --jobs \$(nproc) '${VERSION}'
              ciel push  --pdk-family ${{ matrix.family }} --pdk-root '${PDK_ROOT}' \
                         --owner vyges-tools --repository pdk-releases '${VERSION}'
            "
