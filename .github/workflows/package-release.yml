name: Package PDK release (non-ciel)
run-name: "package ${{ github.event.inputs.pdk || 'all (weekly)' }} — generic packager"

# The generic-packager path for PDKs ciel can't build (icsprout55 today; NDA / customer
# PDKs later): clone the mirror, pack per manifests/<pdk>.json into ciel-compatible
# per-library tarballs, and publish here. A `setup` job emits a matrix of PDKs — the one
# requested on dispatch, or ALL manifests on the weekly schedule. Skips a PDK whose source
# commit is already released (idempotent; last release stays) unless `force`.

on:
  workflow_dispatch:
    inputs:
      pdk:
        description: 'PDK to package (manifests/<pdk>.json), or "all"'
        default: all
      force:
        description: 'repackage even if the source commit is already released'
        type: boolean
        default: false
  schedule:
    - cron: '30 3 * * 1'   # weekly, Monday 03:30 UTC (staggered after the ciel builds)

permissions:
  contents: write          # ghr creates releases on this repo

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.sel.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the PDKs to package
        id: sel
        env:
          REQ: ${{ github.event.inputs.pdk }}
        run: |
          if [ -z "$REQ" ] || [ "$REQ" = all ]; then
            PDKS=$(ls manifests/*.json | xargs -n1 basename | sed 's/\.json$//' | jq -R . | jq -cs .)
          else
            PDKS=$(printf '%s' "$REQ" | jq -R . | jq -cs .)
          fi
          echo "selected: $PDKS"
          echo "matrix={\"pdk\":$PDKS}" >> "$GITHUB_OUTPUT"

  package:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix (for ghr + zstd)
        uses: DeterminateSystems/nix-installer-action@main
      - name: Clone the mirror, pack per manifest, publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          PDK='${{ matrix.pdk }}'
          MANIFEST="manifests/${PDK}.json"
          MIRROR=$(python3 -c "import json;print(json.load(open('${MANIFEST}'))['source']['mirror'])")
          BRANCH=$(python3 -c "import json;print(json.load(open('${MANIFEST}'))['source'].get('ref_branch','main'))")
          git clone --depth 1 --branch "${BRANCH}" "https://${MIRROR}.git" src
          VERSION=$(git -C src rev-parse HEAD)
          TAG="${PDK}-${VERSION}"
          # Skip if this exact source commit is already released (last release stays). `force` overrides.
          if [ '${{ github.event.inputs.force }}' != 'true' ] && \
             gh release view "${TAG}" --repo vyges-tools/pdk-releases >/dev/null 2>&1; then
            echo "::notice::${TAG} already released — ${PDK} source unchanged, skipping"
            exit 0
          fi
          echo "Packaging ${PDK} @ ${VERSION}"
          nix shell 'nixpkgs#ghr' 'nixpkgs#zstd' --command \
            python3 scripts/pack_pdk.py \
              --source src --manifest "${MANIFEST}" --version "${VERSION}" --out dist \
              --owner vyges-tools --repository pdk-releases
